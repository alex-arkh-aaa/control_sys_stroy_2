version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: control_sys_2
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  api_gateway:
    build: ./api_gateway
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - JWT_SECRET=your-secret-key-change-in-production
    volumes:
      - ./api_gateway:/app  # 👈 Оставляем как у тебя
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - service_users
      - service_orders

  service_users:
    build: ./service_users
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:password@postgres:5432/users_db  # 👈 ДЛЯ DOCKER
      - JWT_SECRET_KEY=MxgmM26gBQqYdI9Bj3TGbSczW3Fyx2Odw21dp9Hy8aI
      - JWT_ALGORITHM=HS256
      - ACC_TOKEN_EXP_MIN=60
    volumes:
      - ./service_users:/app  # 👈 Оставляем как у тебя
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres

  service_orders:
    build: ./service_orders
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:password@postgres:5432/orders_db  # 👈 ДЛЯ DOCKER
      - JWT_SECRET=your-secret-key-change-in-production
      - USERS_SERVICE_URL=http://service_users:8000
    volumes:
      - ./service_orders:/app  # 👈 Оставляем как у тебя
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
      - service_users

volumes:
  postgres_data: